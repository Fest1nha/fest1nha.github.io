name: Atualizar vídeos

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas
  workflow_dispatch:         # permite rodar na mão

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar vídeos do canal
        run: python atualizar_videos.py
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Atualiza vídeos"
            git push
          fi
